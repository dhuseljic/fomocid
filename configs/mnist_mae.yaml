seed: 7

dataset:
  name: mnist
  data_dir: /home/datasets
  image_size: 28
  batch_size: 256
  eval_batch_size: 512
  num_workers: 4
  download: true
  use_fake_data: false
  fake_data_size: 128
  pretrain_split: train
  train_split: train
  test_split: test

ssl:
  method: mae
  patch_size: 2
  mask_ratio: 0.75
  min_scale: 0.8
  encoder_depth: 4
  encoder_num_heads: 4
  encoder_hidden_dim: 128
  encoder_mlp_dim: 512
  embedding_pool: cls
  decoder_depth: 2
  decoder_num_heads: 4
  decoder_hidden_dim: 96
  decoder_mlp_dim: 384
  normalize_pixel_targets: true
  dropout: 0.0
  attention_dropout: 0.0

optimizer:
  lr: 1.0e-3
  weight_decay: 0.01
  scheduler:
    enabled: true
    name: cosine_with_warmup
    warmup_epochs: 5.0
    min_lr: 1.0e-5
    interval: step

trainer:
  accelerator: auto
  devices: auto
  max_epochs: 50
  limit_train_batches: 1.0
  log_every_n_steps: 10
  enable_logging: true
  enable_progress_bar: true
  progress_bar: auto
  progress_refresh_rate: 1
  deterministic: false
  fast_dev_run: false

evaluation:
  linear_probe:
    epochs: 15
    lr: 0.01
    weight_decay: 0.0
    batch_size: 256
  knn:
    k: 5
    chunk_size: 512

analysis:
  projection_method: tsne
  num_query_images: 8
  num_neighbors: 5
