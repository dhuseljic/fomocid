seed: 7

dataset:
  name: stl10
  data_dir: /tmp/fomocid-data
  image_size: 96
  batch_size: 4
  eval_batch_size: 4
  num_workers: 0
  download: false
  use_fake_data: true
  fake_data_size: 24
  pretrain_split: train+unlabeled
  train_split: train
  test_split: test

ssl:
  method: dino
  backbone: resnet18
  global_crop_size: 96
  global_crop_scale: [0.5, 1.0]
  local_crop_size: 48
  local_crop_scale: [0.2, 0.5]
  n_local_views: 2
  projection_hidden_dim: 256
  projection_bottleneck_dim: 64
  projection_output_dim: 256
  projection_batch_norm: true
  freeze_last_layer_epochs: 1
  norm_last_layer: true
  teacher_momentum_start: 0.996
  teacher_momentum_end: 1.0
  warmup_teacher_temp: 0.04
  teacher_temp: 0.04
  warmup_teacher_temp_epochs: 1
  student_temp: 0.1
  center_momentum: 0.9
  color_jitter_strength: 0.5
  random_gray_scale: 0.2
  gaussian_blur: [1.0, 0.1, 0.5]
  solarization_prob: 0.0

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler:
    enabled: true
    name: cosine_with_warmup
    warmup_epochs: 0.25
    min_lr: 1.0e-5
    interval: step

trainer:
  accelerator: cpu
  devices: 1
  max_epochs: 1
  limit_train_batches: 2
  log_every_n_steps: 1
  enable_logging: true
  enable_progress_bar: false
  progress_bar: auto
  progress_refresh_rate: 1
  deterministic: true
  fast_dev_run: false

evaluation:
  max_feature_batches: 2
  linear_probe:
    epochs: 2
    lr: 0.01
    weight_decay: 0.0
    batch_size: 4
  knn:
    k: 3
    chunk_size: 4

analysis:
  projection_method: pca
  num_query_images: 4
  num_neighbors: 3
